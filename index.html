@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--panel:#1B2436;--ink:#E7ECF5;--muted:#A6B0C3;--line:#2E3A52;--chip:#25304A}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.5}
main{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
.layout{display:grid;grid-template-columns:1fr;gap:20px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;overflow-x:auto}
.chart svg{width:100%;min-width:720px;height:auto;display:block}
.node{cursor:pointer;transition:opacity .2s, transform .2s;transform-box:fill-box;transform-origin:center}
.node:hover{transform:translateY(-2px)}
.node:focus{outline:none}
.node:focus-visible rect:first-child, .node.active > g rect{stroke-width:4}
.chart.has-active .node:not(.active){opacity:.45}
aside{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px;max-width:860px}
aside h2{margin:0 0 4px;font-size:1.25rem;display:flex;gap:10px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:.9rem;font-weight:700;flex:none}
aside h3{font-size:.95rem;margin:16px 0 4px}
aside p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.82rem}
.nb{display:inline-block;margin-top:16px;font-size:.9rem;color:var(--accent);font-weight:600;text-decoration:none}
.nb:hover{text-decoration:underline}
.nav{display:flex;gap:8px;margin-top:18px}
.nav button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px;font:inherit;cursor:pointer}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.9rem;margin-top:10px}
@media (prefers-reduced-motion:reduce){.node{transition:none}.node:hover{transform:none}}
</style></head>

<script>
const D={"1": {"t": "Ingest", "nb": "01_data_ingestion_and_quality", "what": "Read the raw App Store CSV with Spark, map its column names onto one canonical set, and cast every field to an explicit type.", "why": "Inferred schemas are slow and fragile. An explicit schema makes the pipeline reproducible and fails loudly if a column is missing, instead of quietly analysing demo data.", "tech": ["StructType schema", "multiLine / escape CSV options", "column-name mapping", "fail-fast validation"]}, "2": {"t": "Audit data quality", "nb": "01_data_ingestion_and_quality", "what": "Count missing values for every column in one pass, flag IQR outliers with approximate percentiles, and check business rules such as ratings between 0 and 5 and unique app IDs.", "why": "Bad data produces confident but wrong insights. Auditing first shows what needs cleaning and which extreme values are real market behaviour.", "tech": ["single-pass aggregations", "percentile_approx", "IQR rule", "duplicate detection"]}, "3": {"t": "Clean and engineer", "nb": "01_data_ingestion_and_quality", "what": "Remove invalid rows and duplicates, keep unrated apps unrated, and add business features: free flag, price, rating and size bands, and a popularity score.", "why": "Filling missing ratings with 0 would drag averages down. Clear, named bands make the later analysis easy to read for a product team.", "tech": ["dropDuplicates", "null-safe features", "when/otherwise banding", "Parquet output partitioned by genre"]}, "4": {"t": "Descriptive analytics", "nb": "02_descriptive_analytics", "what": "Summarise reach, rating, price and revenue potential by genre, segment apps by price and popularity, and compare mean with median rating counts.", "why": "Genre and pricing patterns answer the product team's first questions. The mean vs median gap shows how concentrated the market is.", "tech": ["groupBy / agg", "approxQuantile bands", "heatmaps", "skew analysis"]}, "5": {"t": "Free vs paid", "nb": "03_free_vs_paid_comparison", "what": "Compare free and paid apps overall, then within each genre and popularity band, with a Welch t-test and Cohen's d.", "why": "A naive comparison mixes genres and popularity levels. Stratifying and reporting effect size shows whether a difference is real and whether it matters.", "tech": ["pivot", "stratification", "Welch t-test", "Cohen's d"]}, "6": {"t": "Engagement ranking", "nb": "04_engagement_score_and_ranking", "what": "Combine normalised rating (quality) and log-scaled rating count (reach) into one score, rank apps inside each genre, and test how stable the ranking is when the weights change.", "why": "Log-scaling stops a few blockbuster apps from dominating. The sensitivity check proves the ranking does not depend on one arbitrary weight choice.", "tech": ["row_number / percent_rank windows", "log1p normalisation", "Spearman correlation"]}, "7": {"t": "Optimise performance", "nb": "05_performance_optimisation", "what": "Benchmark a repeated analytics workload step by step: Parquet instead of CSV, column pruning, caching and shuffle-partition tuning, then read the physical plans and monitor jobs in the Spark UI.", "why": "Each optimisation is measured with a warm-up run and the median of repeated runs, so the speed-ups reported are real rather than one-off timings.", "tech": ["Adaptive Query Execution", "cache", "spark.sql.shuffle.partitions", "explain(formatted)", "broadcast join", "Spark UI"]}, "8": {"t": "Insights and scale-out", "nb": "05_performance_optimisation", "what": "Turn results into recommendations for app developers, record the limits of each metric, and plan how the pipeline would handle 50 times more data.", "why": "Insights are only useful if their caveats are clear, and a pipeline is only useful if it keeps working as data grows.", "tech": ["business recommendations", "documented limitations", "partitioning and skew strategy", "approximate algorithms"]}};
const C={1:"#2B59C3",2:"#0E9384",3:"#7A4FD1",4:"#E25A1C",5:"#D1335B",6:"#D99A06",7:"#16A34A",8:"#1F2A44"};
const REPO="https://github.com/spoorthihs4-ops/app-store-analytics-spark/blob/main/";
const chart=document.getElementById("chart"), panel=document.getElementById("panel");
let cur=1;
function show(n){
  cur=n; const d=D[n];
  document.querySelectorAll(".node").forEach(g=>g.classList.toggle("active",+g.dataset.n===n));
  chart.classList.add("has-active");
  panel.innerHTML=`<h2><span class="dot" style="background:${C[n]}">${n}</span>${d.t}</h2>
  <h3>What happens</h3><p>${d.what}</p>
  <h3>Why it matters</h3><p>${d.why}</p>
  <h3>Spark techniques</h3><div class="chips">${d.tech.map(t=>`<span>${t}</span>`).join("")}</div>
  <a class="nb" href="${REPO+d.nb}.ipynb" target="_blank" rel="noopener">Open notebook ${d.nb.slice(0,2)} on GitHub</a>
  <div class="nav"><button id="prev" ${n===1?"disabled":""}>Previous stage</button><button id="next" ${n===8?"disabled":""}>Next stage</button></div>`;
  document.getElementById("prev").onclick=()=>show(Math.max(1,n-1));
  document.getElementById("next").onclick=()=>show(Math.min(8,n+1));
}
document.querySelectorAll(".node").forEach(g=>{
  g.addEventListener("click",()=>show(+g.dataset.n));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show(+g.dataset.n);}});
});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="BUTTON")return;
  if(e.key==="ArrowRight")show(Math.min(8,cur+1));
  if(e.key==="ArrowLeft")show(Math.max(1,cur-1));
});
show(1);
</script>
